<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Context Passport terminal demo">
  <rect width="960" height="520" rx="24" fill="#0b1020"/>
  <rect x="32" y="32" width="896" height="456" rx="16" fill="#111827" stroke="#334155"/>
  <circle cx="62" cy="58" r="7" fill="#ef4444"/>
  <circle cx="86" cy="58" r="7" fill="#f59e0b"/>
  <circle cx="110" cy="58" r="7" fill="#22c55e"/>
  <text x="48" y="112" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">$ passport capture --url https://github.com/owner/repo/issues/1 --out issue-bundle</text>
  <text x="48" y="154" fill="#e5e7eb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">issue-bundle</text>
  <text x="48" y="210" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">$ passport redact issue-bundle --apply</text>
  <text x="48" y="252" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">[REDACTED:github_token] [REDACTED:email] [REDACTED:local_path]</text>
  <text x="48" y="308" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">$ passport inspect issue-bundle</text>
  <text x="48" y="350" fill="#e5e7eb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">Context Passport: GitHub Issue Handoff</text>
  <text x="48" y="386" fill="#e5e7eb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">sources: 1   artifacts: 1   redactions: 3   valid: yes</text>
  <text x="48" y="442" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">$ passport export issue-bundle --out issue-bundle.cpb.zip</text>
</svg>
